name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Validate contracts and governance
        run: node scripts/validate-aos.mjs

      - name: P5 governed Work smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\run_p5_governed_work_smoke.ps1

      - name: P5 hardening gate
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\run_p5_hardening_gate.ps1

      - name: P6 governed extension ecosystem smoke
        shell: pwsh
        run: ./scripts/run_p6_extension_ecosystem_smoke.ps1

      - name: P6.1 repeated snapshot pilot gate
        shell: pwsh
        run: ./scripts/run_p6_1_multi_repository_pilot.ps1 -RepositoryPath $PWD -Repeats 2

      - name: P6.2 filesystem fault-injection gate
        shell: pwsh
        run: ./scripts/run_p6_2_fault_injection_gate.ps1

      - name: P6.2 installed-pilot harness smoke
        shell: pwsh
        run: ./scripts/run_p6_2_installed_pilot_sample.ps1 -RepositoryPath $PWD -SamplesPerRun 1 -MinimumDurationDays 0 -MinimumSamples 1 -PilotId ci-harness-smoke

      - name: P6.3 Windows offline installer smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\run_p6_3_windows_installer_smoke.ps1

      - name: P6.3 Linux offline installer smoke
        if: runner.os == 'Linux'
        shell: bash
        run: sh ./scripts/run_p6_3_linux_installer_smoke.sh

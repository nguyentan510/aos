name: Release candidate

on:
  push:
    tags:
      - "v*-rc.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: aos-x86_64-pc-windows-msvc.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: aos-x86_64-unknown-linux-gnu.tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked

      - name: Validate contracts and governance
        run: node scripts/validate-aos.mjs

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "dist\package" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\aos.exe" "dist\package\aos.exe"
          Copy-Item "extensions" "dist\package\extensions" -Recurse
          Compress-Archive -Path "dist\package\*" -DestinationPath "dist\${{ matrix.archive }}"
          Remove-Item "dist\package" -Recurse

      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/aos" dist/package/aos
          cp -R extensions dist/package/extensions
          tar -czf "dist/${{ matrix.archive }}" -C dist/package aos extensions
          rm -rf dist/package

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish prerelease
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add installers
        shell: bash
        run: |
          cp install.ps1 install.sh dist/

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum aos-* install.ps1 install.sh > SHA256SUMS

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "AOS ${GITHUB_REF_NAME}" \
            --prerelease \
            --generate-notes

  release-smoke:
    name: Hosted install smoke (${{ matrix.os }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: aos-x86_64-pc-windows-msvc.zip
          - os: ubuntu-latest
            archive: aos-x86_64-unknown-linux-gnu.tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Download published RC assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist \
            --pattern "${{ matrix.archive }}" \
            --pattern "SHA256SUMS"

      - name: Windows one-line equivalent smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $project = Join-Path $env:RUNNER_TEMP "aos-project"
          $install = Join-Path $env:RUNNER_TEMP "aos-install"
          New-Item -ItemType Directory -Path $project | Out-Null
          .\install.ps1 -Version $env:GITHUB_REF_NAME -ProjectPath $project -Yes `
            -InstallRoot $install -NoPathUpdate `
            -ArchivePath "dist\${{ matrix.archive }}" -ChecksumPath "dist\SHA256SUMS"
          & "$install\bin\aos.exe" doctor $project --format=json
          .\scripts\run_p6_extension_ecosystem_smoke.ps1 `
            -AosBinary "$install\bin\aos.exe" `
            -OutputDir (Join-Path $env:RUNNER_TEMP "aos-extension-smoke")
          .\install.ps1 -Uninstall -Yes -InstallRoot $install -NoPathUpdate
          if (-not (Test-Path "$project\.aos\repository.json")) {
            throw "uninstall removed downstream .aos"
          }

      - name: Linux one-line equivalent smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/aos-home"
          mkdir -p "$HOME" "$RUNNER_TEMP/aos-project"
          sh ./install.sh \
            --version "$GITHUB_REF_NAME" \
            --project-path "$RUNNER_TEMP/aos-project" \
            --yes \
            --install-root "$RUNNER_TEMP/aos-install" \
            --no-path-update \
            --archive-path "dist/${{ matrix.archive }}" \
            --checksum-path "dist/SHA256SUMS"
          "$HOME/.local/bin/aos" doctor "$RUNNER_TEMP/aos-project" --format=json
          pwsh ./scripts/run_p6_extension_ecosystem_smoke.ps1 \
            -AosBinary "$HOME/.local/bin/aos" \
            -OutputDir "$RUNNER_TEMP/aos-extension-smoke"
          sh ./install.sh --uninstall --yes \
            --install-root "$RUNNER_TEMP/aos-install" --no-path-update
          test -f "$RUNNER_TEMP/aos-project/.aos/repository.json"

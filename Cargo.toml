[package]
name = "aos-cli"
version = "0.1.0"
edition = "2024"
description = "AOS Project Intelligence Operating System CLI"
license = "Apache-2.0"
rust-version = "1.96"

[[bin]]
name = "aos"
path = "src/main.rs"

[dependencies]
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"
